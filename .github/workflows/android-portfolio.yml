name: Android portfolio screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-portfolio.yml'
      - 'test_driver/portfolio_driver.dart'
      - 'integration_test/app_flow_test.dart'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' --channel=3
      - name: Generate application sources
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android app and capture actual UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: flutter drive --driver=test_driver/portfolio_driver.dart --target=integration_test/app_flow_test.dart --dart-define=API_BASE_URL=http://127.0.0.1:9 --dart-define=PORTFOLIO_SCREENSHOTS=true
      - name: Save screenshots and example PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homevault-android-portfolio
          path: artifacts/portfolio/
          if-no-files-found: warn
          retention-days: 14
